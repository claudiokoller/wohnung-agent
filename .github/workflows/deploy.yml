name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax-/Import-Check
        run: |
          python -m compileall -q .
          python -c "import config, db, sources, notify, email_source, gmail_oauth, application, main, command; print('imports ok')"

      - name: Unit-Tests
        run: python test_command.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH-Key einrichten
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Code auf VPS kopieren
        run: |
          scp -i ~/.ssh/deploy_key \
            *.py requirements.txt \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/root/wohnungs-bot/

      - name: Services neu starten
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "systemctl restart wohnungs-bot wohnungs-bot-cmd && \
             systemctl status wohnungs-bot wohnungs-bot-cmd --no-pager"
